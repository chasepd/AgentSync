[package]
name = "agentsync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonc-parser = { version = "0.32", features = ["serde", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

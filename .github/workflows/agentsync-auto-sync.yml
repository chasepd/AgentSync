name: AgentSync Auto Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/agentsync-sync-pr.yml
    with:
      branch: agentsync/auto-sync
      commit-message: Sync agent configuration
      pr-title: Sync agent configuration
      pr-body: |
        AgentSync generated updates from the changed native source so agent configuration files stay in sync.

name: AgentSync Auto Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/agentsync-sync-pr.yml
    with:
      sync-command: agentsync sync --all --from agents-md --to claude,cursor,opencode --write
      branch: agentsync/auto-sync
      commit-message: Sync agent configuration
      pr-title: Sync agent configuration
      pr-body: |
        AgentSync generated updates from `AGENTS.md` so native agent configuration files stay in sync.

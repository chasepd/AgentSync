name: AgentSync Drift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agentsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: cargo install --path crates/agentsync-cli
      - run: agentsync status --check
